class: ReadingProgress
table: reading_progress
fields:
  childId: int, relation(parent=child_profiles, onDelete=Cascade)
  bookId: int, relation(parent=book)
  currentPage: int
  completed: bool
  startedAt: DateTime
  completedAt: DateTime?
  totalTimeSeconds: int
  syncedAt: DateTime
indexes:
  idx_progress_child_book:
    fields: childId, bookId
  idx_progress_child_started:
    fields: childId, startedAt