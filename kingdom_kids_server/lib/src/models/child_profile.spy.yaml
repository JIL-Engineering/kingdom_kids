class: ChildProfile
table: child_profiles
fields:
  parentId: int, relation(parent=users, onDelete=Cascade)
  displayName: String
  birthYear: int
  ageBracket: String
  preferredLanguage: String
  avatarId: String
  pinProtected: bool
  createdAt: DateTime
indexes:
  child_profiles_parent_idx:
    fields: parentId