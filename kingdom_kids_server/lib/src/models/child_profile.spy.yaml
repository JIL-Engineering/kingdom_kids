class: ChildProfile
table: child_profiles
fields:
  parent_id: int, relation(parent=user, onDelete=Cascade)
  display_name: String
  birth_year: int
  age_bracket: String
  preferred_language: String
  avatar_id: String
  pin_protected: bool
  created_at: DateTime
indexes:
  idx_child_profiles_parent:
    fields: parent_id