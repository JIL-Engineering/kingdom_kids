class: AppUser
table: users
fields:
  email: String
  authUserId: int
  country: String?
  timezone: String
  preferredLanguage: String
  consentGivenAt: DateTime?
  createdAt: DateTime
indexes:
  users_email_idx:
    fields: email
    unique: true
  users_auth_user_id_idx:
    fields: authUserId
    unique: true