class: AppUser
table: users
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  country: String?
  timezone: String
  preferredLanguage: String
  consentGivenAt: DateTime?
  createdAt: DateTime
indexes:
  users_auth_user_idx:
    fields: authUserId
    unique: true