class: DevotionalTranslation
table: devotional_translation
fields:
  devotionalId: int, relation(parent=devotional, onDelete=Cascade)
  language: String
  verseReference: String
  verseText: String
  thoughtText: String
  prayerPrompt: String
indexes:
  idx_devotional_translations_dev_lang:
    fields: devotionalId, language
    unique: true